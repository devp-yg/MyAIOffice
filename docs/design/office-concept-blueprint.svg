<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">My AI Office 공용 업무층 개념 청사진</title>
<desc id="desc">프로젝트별 층 대신 하나의 넓은 층을 업무 프로세스별 구역으로 나누고, 여러 프로젝트 직원이 함께 일하는 개념 평면도.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e4e8de" stroke-width="1"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24352d" flood-opacity=".12"/></filter>
  <style>
    .title{font:700 34px sans-serif;fill:#24352d}.sub{font:16px sans-serif;fill:#617166}.zone{stroke:#869587;stroke-width:2}.ztitle{font:700 23px sans-serif;fill:#29382e}.zsub{font:15px sans-serif;fill:#536257}.furn{fill:#fffdf7;stroke:#b2bcae;stroke-width:2}.desk{fill:#d8c5a4;stroke:#9b896d;stroke-width:1.5}.screen{fill:#52675f}.seat{fill:#879987}.route{fill:none;stroke:#607e68;stroke-width:6;stroke-dasharray:3 14;stroke-linecap:round;opacity:.8}.person{stroke:#fff;stroke-width:3}.tag{font:12px sans-serif;fill:#fff;font-weight:700}.note{font:14px sans-serif;fill:#46564b}
  </style>
</defs>
<rect width="1600" height="1000" fill="#f6f6ef"/>
<text x="70" y="72" class="title">MY AI OFFICE · 공용 업무층</text>
<text x="70" y="105" class="sub">프로젝트는 이름표로 구분하고, 업무가 비슷한 직원은 공용 구역에서 함께 일합니다.</text>
<g filter="url(#shadow)"><rect x="75" y="145" width="1450" height="760" rx="34" fill="#fffdf7" stroke="#d5dccf" stroke-width="3"/></g>
<rect x="95" y="165" width="1410" height="720" rx="24" fill="url(#grid)"/>
<!-- zones -->
<rect x="115" y="185" width="370" height="265" rx="22" fill="#f4edda" class="zone"/>
<rect x="505" y="185" width="610" height="265" rx="22" fill="#e4ecdf" class="zone"/>
<rect x="1135" y="185" width="350" height="265" rx="22" fill="#e3eaf0" class="zone"/>
<rect x="115" y="470" width="470" height="240" rx="22" fill="#eee7f3" class="zone"/>
<rect x="1035" y="470" width="450" height="240" rx="22" fill="#f2e8ed" class="zone"/>
<rect x="115" y="730" width="1370" height="135" rx="22" fill="#e9eee5" class="zone"/>
<!-- labels -->
<text x="145" y="225" class="ztitle">자료 탐색</text><text x="145" y="251" class="zsub">파일 읽기 · 웹 검색 · 도구 사용</text>
<text x="535" y="225" class="ztitle">개발</text><text x="535" y="251" class="zsub">코드 작성 · 수정 · 구현</text>
<text x="1165" y="225" class="ztitle">실행 · 서버</text><text x="1165" y="251" class="zsub">빌드 · 명령 · 도구 작업</text>
<text x="145" y="510" class="ztitle">검토 · 회의</text><text x="145" y="536" class="zsub">결과 확인 · 계획 · 협업</text>
<text x="1065" y="510" class="ztitle">휴식 · 대기</text><text x="1065" y="536" class="zsub">유휴 직원과 다음 지시 대기</text>
<text x="145" y="772" class="ztitle">공용 통로</text><text x="145" y="800" class="zsub">업무 구역 간 이동 · 열린 시야</text>
