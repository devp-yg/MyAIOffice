<text x="620" y="535" class="ztitle" style="font-size:19px">선택 공간 확대 영역</text><text x="620" y="565" class="zsub">방이나 직원을 누르면 카메라가 이동</text>
<text x="620" y="603" class="note">전체 보기에서는 층 전체의 동시 작업을 확인</text><text x="620" y="632" class="note">상세 보기에서는 이름표와 작업 상태를 확대</text>
<!-- lounge sofas -->
